<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cell labels</title>
<style>
  :root { --printed: #2f6fd6; --handwritten: #d6452f; --unsure: #7a7a7a; --none: #cfcfcf; }
  body { font: 14px system-ui, sans-serif; margin: 0; display: grid;
         grid-template-columns: 1fr 320px; grid-template-rows: auto auto auto auto 1fr auto;
         height: 100vh; }
  body.mode-photos, body.mode-progress { grid-template-columns: 1fr; }
  body.mode-photos aside, body.mode-progress aside { display: none; }
  header { grid-row: 1; grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 16px; align-items: center;
           padding: 8px 16px; border-bottom: 1px solid #ddd; }
  nav { display: flex; flex-wrap: wrap; gap: 6px; align-items: stretch; }
  nav button { display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
               padding: 4px 10px; text-align: left; cursor: pointer; }
  nav button small { color: #777; font-size: 11px; }
  nav button .label { display: flex; gap: 6px; align-items: baseline; }
  nav button.on { border-color: #111; }
  nav button.on .label { font-weight: bold; }
  nav .badge { min-width: 1.4em; padding: 0 5px; border-radius: 9px; background: #eee;
               color: #333; font-size: 11px; text-align: center; }
  nav .badge.done { background: #dff3e3; color: #1d7a34; }
  nav .divider { width: 1px; background: #ddd; margin: 0 6px; }
  nav .tools { align-self: center; color: #777; font-size: 11px; text-transform: uppercase; }
  nav .tool { opacity: 0.85; }
  #folders { grid-column: 1; grid-row: 3; padding: 8px 16px 0; }
  #folders button.on { font-weight: bold; }
  #message { grid-column: 1; grid-row: 4; padding: 8px 16px 0; color: #b00020; min-height: 1.2em; }
  #title { margin-left: auto; color: #777; font-size: 12px; }
  #banner { grid-column: 1; grid-row: 2; padding: 10px 16px; background: #fff8dc; border-bottom: 1px solid #e8d98a;
            font-size: 15px; font-weight: bold; display: flex; gap: 12px; align-items: center;
            flex-wrap: wrap; }
  #banner:empty { display: none; }
  main { grid-column: 1; grid-row: 5; min-height: 0; overflow: auto; padding: 16px; }
  aside { grid-column: 2; grid-row: 2 / 7; border-left: 1px solid #ddd; padding: 0 16px 16px;
          overflow: auto; line-height: 1.4; }
  aside summary { margin-top: 12px; cursor: pointer; font-weight: bold; }
  aside h3 { margin: 16px 0 4px; font-size: 14px; }
  aside ol { padding-left: 20px; margin: 4px 0; }
  aside li { margin-bottom: 4px; }
  aside dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; margin: 4px 0; }
  aside dt { font-weight: bold; }
  aside dd { margin: 0; }
  aside img.big { width: 256px; height: 256px; background: #eee; }
  #source img { width: 100%; max-width: 320px; background: #eee; }
  aside img.small { width: 64px; height: 64px; margin: 2px; }
  footer { grid-column: 1; grid-row: 6; padding: 8px 16px; border-top: 1px solid #ddd; display: flex;
           gap: 8px; flex-wrap: wrap; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, 100px); gap: 6px; }
  .cell { position: relative; width: 96px; height: 96px; border: 2px solid var(--none); cursor: pointer; }
  .cell:hover { box-shadow: 0 0 0 3px #f2b705; }
  .cell img { width: 96px; height: 96px; display: block; }
  .cell.least { outline: 3px solid #111; outline-offset: 1px; }
  .cell .tag { position: absolute; right: 2px; bottom: 2px; padding: 0 4px; color: #fff;
               font-weight: bold; background: var(--none); }
  .cell .reason { position: absolute; left: 2px; top: 2px; padding: 0 2px; font-size: 11px;
                  background: rgba(255, 255, 255, 0.85); }
  .printed { border-color: var(--printed); } .printed .tag { background: var(--printed); }
  .handwritten { border-color: var(--handwritten); } .handwritten .tag { background: var(--handwritten); }
  .unsure { border-color: var(--unsure); } .unsure .tag { background: var(--unsure); }
  .swatch { display: inline-block; padding: 0 4px; color: #fff; font-weight: bold; }
  table { border-collapse: collapse; }
  th, td { padding: 4px 8px; border-bottom: 1px solid #eee; text-align: right; }
  #state:empty { display: none; }
  #state { padding: 24px 0; font-size: 20px; font-weight: bold; }
  #state .detail { font-size: 14px; font-weight: normal; margin-top: 8px; white-space: pre-line; }
  #state .buttons { display: flex; gap: 8px; margin-top: 12px; }
  #state.error { color: #b00020; }
  #state.error .detail { color: #777; }
  #state.done .mark { color: #1b7f3b; }
  .spinner { display: inline-block; width: 16px; height: 16px; border: 3px solid #ccc;
             border-top-color: #333; border-radius: 50%; animation: spin 0.8s linear infinite;
             vertical-align: -3px; margin-right: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  main.state-hide #photos, main.state-hide #grid, main.state-hide #table { display: none; }
  td.todo { text-align: left; }
  #table .summary { font-size: 20px; font-weight: bold; margin: 0 0 8px; }
  #table .summary-line { margin: 0 0 12px; }
  #table .buttons { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  #table .done { color: #1b7f3b; font-weight: bold; }
  #table tfoot th, #table tfoot td { border-top: 2px solid #999; font-weight: bold; }
  #table .notes { margin: 12px 0 0; }
  .photo-row { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
  .wrap { position: relative; padding: 120px; background: #444; cursor: crosshair; }
  .wrap img { display: block; max-width: 640px; max-height: 70vh; }
  .wrap svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; }
  .flat { width: 400px; height: 400px; background: #eee; }
  .cell.skip { opacity: 0.35; }
  .cell.changed .tag { background: #d6452f; }
  .cell.discarded .tag { background: #111; }
</style>
</head>
<body>
<header>
  <nav>
    <button data-mode="photos"><span class="label">1 Check photos <span class="badge" data-count="photos"></span></span><small>Is the grid outline right?</small></button>
    <button data-mode="digits"><span class="label">2 Confirm digits <span class="badge" data-count="digits"></span></span><small>Does each cell show this digit?</small></button>
    <button data-mode="groups"><span class="label">3 Label kind <span class="badge" data-count="kind"></span></span><small>Printed or handwritten?</small></button>
    <span class="divider"></span>
    <span class="tools">Tools</span>
    <button class="tool" data-mode="review"><span class="label">Review</span><small>Fix doubtful labels</small></button>
    <button class="tool" data-mode="check"><span class="label">Check</span><small>Test your own labels</small></button>
    <button class="tool" data-mode="progress"><span class="label">Progress</span><small>Overview</small></button>
    <span class="divider"></span>
    <button class="tool" id="finish" title="Save and tidy up. Your unlabelled cells and pending photos stay."><span class="label">Finish</span><small>Save and tidy up</small></button>
  </nav>
  <span id="title"></span>
</header>
<div id="banner" role="status"></div>
<div id="folders"></div>
<div id="message" role="status"></div>
<main id="main"><div id="state" role="status"></div><div id="photos"></div><div id="grid"></div><div id="table"></div></main>
<aside>
  <details><summary>Help</summary><div id="help"></div></details>
  <h3>Pointed-at cell</h3>
  <img class="big" id="preview" alt="">
  <div id="source" hidden><img id="source-img" alt=""><p id="source-text"></p></div>
  <p id="detail">Point at a cell to see it large.</p>
  <div id="related"></div>
</aside>
<footer id="actions"></footer>
<script>
const LETTER = { printed: "P", handwritten: "H", unsure: "?" };
const LEGEND = `
  <h3>The kinds</h3>
  <dl>
    <dt><span class="swatch" style="background: var(--printed)">P</span> printed</dt><dd>Made by a printer or a screen.</dd>
    <dt><span class="swatch" style="background: var(--handwritten)">H</span> handwritten</dt><dd>Written by a person with a pen or a pencil.</dd>
    <dt><span class="swatch" style="background: var(--unsure)">?</span> unsure</dt><dd>You cannot decide. Training ignores it.</dd>
    <dt><span class="swatch" style="background: var(--none)">·</span> no kind</dt><dd>Not labelled yet.</dd>
  </dl>
  <p>Judge by look only. A typed digit from an app screenshot is printed.</p>`;
const HELP = {
  photos: `
    <h3>What to do</h3>
    <ol>
      <li>The left image is the photo. The green outline is the grid that the import found.</li>
      <li>The right image is the grid after the flatten, with the cell lines in red. Grey cells are outside the photo and are not cut.</li>
      <li>Do the red lines lie on the grid lines? Press <b>Enter</b>. The page cuts the cells and opens the next photo.</li>
      <li>Wrong outline? Click the 4 corners: top left, top right, bottom right, bottom left. A corner can be in the dark border outside the photo.</li>
      <li>Press <b>C</b> to go back to the found outline.</li>
      <li>Curled page, blurry digits or no sudoku? Press <b>R</b> to reject the photo.</li>
      <li>Press <b>S</b> to skip. The photo comes back after the others.</li>
    </ol>
    <p>You cannot undo a photo. Check the right image before you press Enter.</p>
    <p>After the last photo: open Confirm digits. Press <b>Pre-label new cells</b>. The model then pre-labels the new cells.</p>`,
  digits: `
    <h3>What to do</h3>
    <ol>
      <li>All cells on the screen are cells that the model reads as the same digit. The title names it.</li>
      <li>Click each cell that is not this digit. It fades and stays unlabelled.</li>
      <li>Know the right digit? Point at the cell and press it. <b>0</b> means empty.</li>
      <li>Press <b>X</b> to discard the pointed-at cell: a bad cut, half a digit, or an unreadable mark.</li>
      <li>Press <b>Enter</b>. Every cell that is not faded gets the digit of its tag.</li>
    </ol>
    <p>The least sure cells come first. Check them with care.</p>
    <p>Small pencil notes: click them. They stay unlabelled.</p>
    <p>Press <b>K</b> to show all kinds, not only handwritten cells. Press <b>Z</b> to undo the last Enter.</p>
    <p>The kind comes later, on the Label kind screen.</p>`,
  groups: `
    <h3>What to do</h3>
    <ol>
      <li>Look at all cells on the screen. They look alike.</li>
      <li>Press <b>P</b> if most are printed. Press <b>H</b> if most are handwritten.</li>
      <li>Click each cell of the other kind. A click switches between P and H.</li>
      <li>Cannot decide? ⌥-click the cell. It gets <b>?</b>.</li>
      <li>Wrong digit, or no digit? Point at the cell and press the right digit. <b>0</b> means empty.</li>
      <li>Press <b>Enter</b> to save. The next group opens.</li>
    </ol>
    <p>Cells with a <b>thick black border</b> are the most likely to be the other kind. Check them first.</p>
    <p>A mistake? Press <b>Z</b> to undo the last save or move.</p>
    ${LEGEND}`,
  review: `
    <h3>What to do</h3>
    <ol>
      <li>Each cell is here because a check doubts its label. The note on the cell names the check.</li>
      <li>Point at a cell. The panel below explains the doubt.</li>
      <li>Kind wrong? Click to switch it. ⌥-click for unsure.</li>
      <li>Digit wrong? Point at the cell and press the right digit. <b>0</b> means empty.</li>
      <li>Press <b>Enter</b>. It saves your changes and confirms every other cell on the screen.</li>
    </ol>
    <h3>The checks</h3>
    <dl>
      <dt>near-duplicate</dt><dd>Almost the same image has the other kind.</dd>
      <dt>kind-model</dt><dd>The model is sure the kind is the other one.</dd>
      <dt>digit-model</dt><dd>The model is sure the digit is another one.</dd>
      <dt>check</dt><dd>Your blind check answer differs from the label.</dd>
    </dl>
    <p>Run <code>just suspects</code> in the terminal after a labelling pass. It fills this screen with the model checks.</p>
    ${LEGEND}`,
  check: `
    <h3>What to do</h3>
    <ol>
      <li>This is a blind test of your own labels. The page hides them on purpose.</li>
      <li>Label each cell again, as on the Label kind screen: <b>P</b>, <b>H</b>, click, ⌥-click.</li>
      <li>Press <b>Enter</b> for each screen.</li>
      <li>At the end, the page shows how often you agree with your first labels.</li>
    </ol>
    <p>Each disagreement goes to the Review screen. Your answers never change a label.</p>
    ${LEGEND}`,
  finish: "",
  progress: `
    <h3>What to do</h3>
    <ol>
      <li>Read the sentence above the table. It says what is left.</li>
      <li>Press a button in the To do column to label the cells without a kind.</li>
      <li>When every row says Done, stop the server with Ctrl-C. Run <code>just suspects</code>.</li>
      <li>Start the server again. Work through the Review screen.</li>
      <li>After 7 days or more, run the Check screen.</li>
    </ol>`,
};
const PAGE = 50;
let mode = "groups";
let screen = null;
let local = {};
let hovered = null;
let checkPage = 0;
let busy = false;
let checkDone = false;
let finishResult = null;  // the last /api/finish
let progressData = null;  // the last /api/progress, for the banner
let lastTarget;       // the target of the last open(), for Try again
let checkError = "";
let lastStatus = null;  // the last /api/status, for the banner
let photo = null;      // the photo on the Photos screen, from /api/photos/next
let corners = null;    // [[x, y] × 4] in full-size upright photo pixels
let clicks = [];       // corners that the person clicked, in the order TL, TR, BR, BL
let kinds = "handwritten";
let digit = "1";
const PAD = 120;       // the dark border around the photo: room for corners outside it
const DIGITS = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "empty"];

const DO = {
  photos: "Do the red lines follow the grid? Press Enter. If not, click the 4 corners, then press Enter.",
  guessPrinted: "The model thinks these cells are printed. Click each cell that is not. Then press Enter.",
  guessHandwritten: "The model thinks these cells are handwritten. Click each cell that is not. Then press Enter.",
  guessOther: "The model sees no printed or handwritten digit in these cells. Press P or H, click the odd ones, then press Enter.",
  groups: "Press P if most cells are printed, or H if most are handwritten. Click the odd ones. Press Enter.",
  review: "Click each cell with the wrong kind. Then press Enter.",
  check: "Label each cell again without looking back. Press Enter.",
};

const $ = (id) => document.getElementById(id);
const say = (text) => { $("message").textContent = text || ""; };

const TIMEOUT = { normal: 60000, slow: 300000 };  // the slow routes read every cell
const SLOW_ROUTES = ["/api/review", "/api/check", "/api/prelabel", "/api/finish"];
const NO_SERVER = "Cannot reach the server. Start it again with just label-cells. " +
  "Then press Try again.";
const PAGE_BUG = "Something went wrong in the page. Reload the page.";
// A message that the person can act on. Any other error is a bug of the page.
const known = (message) => Object.assign(new Error(message), { known: true });
const TOO_SLOW = "The server did not answer in time. Press Try again.";

async function api(path, body) {
  const options = body === undefined ? {} : {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  };
  const controller = new AbortController();
  const limit = SLOW_ROUTES.some((r) => path.startsWith(r)) ? TIMEOUT.slow : TIMEOUT.normal;
  const timer = setTimeout(() => controller.abort(), limit);
  try {
    let response;
    let value;
    try {
      response = await fetch(path, { ...options, signal: controller.signal });
      value = await response.json();
    } catch (error) {
      if (error.name === "AbortError") throw known(TOO_SLOW);
      if (response) throw known("The server sent an answer that the page cannot read.");
      throw known(NO_SERVER);
    }
    if (!response.ok) throw known(value.error || response.statusText);
    return value;
  } finally {
    clearTimeout(timer);
  }
}

// The one visible state of the screen: loading, error, empty, done or ready.
// kind "ready" shows the screen. The other kinds hide it, except a done state with keep.
let view = { kind: "ready" };

function showState(kind, text, buttons = [], detail = "", keep = false) {
  view = { kind, text, buttons, detail, keep };
  applyView();
}

function applyView() {
  const box = $("state");
  box.innerHTML = "";
  box.className = view.kind;
  $("main").className = view.kind !== "ready" && !view.keep ? "state-hide" : "";
  if (view.kind === "ready") return;
  const line = document.createElement("div");
  if (view.kind === "loading") {
    const spin = document.createElement("span");
    spin.className = "spinner";
    line.append(spin);
  }
  line.append(view.text);
  box.append(line);
  if (view.detail) {
    const detail = document.createElement("div");
    detail.className = "detail";
    detail.textContent = view.detail;
    box.append(detail);
  }
  if (view.buttons.length) {
    const row = document.createElement("div");
    row.className = "buttons";
    for (const [label, action] of view.buttons) addButton(row, label, action);
    box.append(row);
  }
}

const isBlocked = () => view.kind !== "ready";
// Undo and the kinds switch still work on an empty or finished screen.
const allowedWhenBlocked = (key) => view.kind !== "loading" && view.kind !== "error" &&
  (key === "z" || (key === "k" && mode === "digits"));

function startLoading() {
  const slow = mode === "review" || mode === "check";
  if (mode === "finish") {
    return showState("loading", "Finishing…", [], "The tool checks every cell and photo. This takes a while.");
  }
  showState("loading", "Loading…", [], slow ? "This takes about 30 seconds the first time." : "");
  renderActions();
}

// A failed load hides the screen. Try again repeats the same load: error.retry.
function fail(error) {
  const retry = error.retry || (() => open(mode, lastTarget));
  const text = error.known ? error.message : PAGE_BUG;
  showState("error", text, [["Try again", retry]], error.known ? "" : error.message);
  renderActions();
}

// A failed action keeps the screen, and so the unsaved clicks. The red line says why.
function failAction(error) {
  endLoading();
  render();
  say(error.known ? error.message : `${PAGE_BUG} (${error.message})`);
}

async function asLoad(retry, load) {
  try {
    return await load();
  } catch (error) {
    error.load = true;
    error.retry = retry;
    throw error;
  }
}

// A load that ended replaces the loading or error state. The derived state follows in render.
function endLoading() {
  if (view.kind === "loading" || view.kind === "error") view = { kind: "ready" };
}

const OPEN_DIGITS = ["Open Confirm digits", () => open("digits")];
const OPEN_PROGRESS = ["Open Progress", () => open("progress")];
const OPEN_REVIEW = ["Open Review", () => open("review")];

// What the data says about the screen. Runs after every render.
function deriveView() {
  if (view.kind === "loading" || view.kind === "error") return applyView();
  if (mode === "finish" && finishResult) return finishPanel(finishResult);
  const st = lastStatus;
  if (mode === "photos" && !photo && st) {
    if (st.photos_total === 0) {
      return showState("empty", "No photos yet. Run just import-photos <folder>, then restart the server.");
    }
    return showState("done", "All photos are checked. ✓ Next: Confirm digits.", [OPEN_DIGITS]);
  }
  if (mode === "groups" && !screen && st) {
    if (st.digit_cells === 0) {
      return showState("empty", "No cells to label yet. Confirm digits first.", [OPEN_DIGITS]);
    }
    return showState("done", "Every cell has a kind. ✓ Next: Review.", [OPEN_REVIEW], STOP_SUSPECTS);
  }
  if (mode === "digits" && screen && !screen.left) return deriveDigits();
  if (mode === "review" && screen && !screen.open) {
    if (!screen.suspects) return showState("empty", REVIEW_NEVER, [OPEN_PROGRESS]);
    return showState("done", "Nothing to review. ✓ All labels look fine.", [OPEN_PROGRESS]);
  }
  if (mode === "check" && !screen) {
    if (checkDone) {
      return showState("done", "The check is done. ✓ Next: open Review.", [OPEN_REVIEW], "", true);
    }
    return showState("empty", "Not enough labels to test yet. Label more cells first.",
      [["Open Label kind", () => open("groups")]], checkError);
  }
  showState("ready");
}

const REVIEW_NEVER = "Nothing to review yet. Stop the server. Run just suspects. Start the server again.";

function deriveDigits() {
  const st = lastStatus;
  const next = DIGITS.find((d) => screen.counts[d] > 0);
  if (next) {
    return showState("done", `No cells left for ${screen.digit}. ✓ Open digit ${next}.`,
      [[`Open digit ${next}`, () => run(() => loadDigits(next))]]);
  }
  if (!st) return showState("ready");
  if (st.digits > 0) {
    return showState("empty", "No handwritten cells to show. Press K to show all kinds.",
      [["Show all kinds", () => run(toggleKinds)]]);
  }
  const n = screen.not_prelabelled;
  if (n) {
    return showState("empty", `${n} new ${n === 1 ? "cell has" : "cells have"} no pre-label.`,
      [["Pre-label new cells", () => run(prelabel)]]);
  }
  if (st.digit_cells === 0) {
    return showState("empty", "No cells to confirm yet. Check photos first.",
      [["Open Check photos", () => open("photos")]]);
  }
  showState("done", "All digits are confirmed. ✓ Next: Label kind.",
    [["Open Label kind", () => open("groups")]]);
}

function cellsOnScreen() {
  if (!screen) return [];
  if (mode === "groups") return screen.cells;
  if (mode === "review") return screen.items;
  if (mode === "check") return screen.cells.slice(checkPage * PAGE, (checkPage + 1) * PAGE);
  if (mode === "digits") return screen.cells;
  return [];
}

function reasonText(cell) {
  return `in ${cell.folder}/ · ${[...new Set(cell.reasons.map((r) => r.reason))].join(", ")}`;
}

function detailText(cell) {
  if (mode === "groups" && cell.kp !== undefined) {
    const mine = cell.kind && cell.kind !== cell.model_kind ? ` Your label: ${cell.kind}.` : "";
    return `The model reads ${cell.model_kind} (${Math.round(cell.kp * 100)} %).${mine}`;
  }
  if (mode === "digits") return `The model reads ${screen.digit} (${Math.round(cell.p * 100)} %).`;
  if (mode !== "review") return "Press a digit to move this cell to that folder. 0 means empty.";
  const twins = nearDuplicates(cell);
  const near = twins.length ? [`Its near-duplicates (below) have the other kind.`] : [];
  return `This cell is in folder ${cell.folder}/. ` + near.concat(cell.reasons.filter((r) => r.reason !== "near-duplicate").map((r) => {
    if (r.reason === "check") return `Your check answer: ${r.answer}. The label: ${r.label}.`;
    return `The model says ${r.predicted} (${Math.round(r.p_predicted * 100)} %). The label: ${r.label}.`;
  })).join(" ");
}

function nearDuplicates(cell) {
  if (mode !== "review") return [];
  const ids = cell.reasons.filter((r) => r.reason === "near-duplicate").flatMap((r) => r.group);
  return [...new Set(ids)].filter((id) => id !== cell.id);
}

let sourceTimer = null;

// The debounce keeps a fast mouse from flooding the server. Not wrapped in run: hover runs outside it.
function showSource(cell) {
  clearTimeout(sourceTimer);
  $("source").hidden = true;
  sourceTimer = setTimeout(async () => {
    try {
      const found = await api(`/api/source?cell=${cell.stem}`);
      if (hovered !== cell || !found) return;
      $("source-img").src = `/source/${cell.stem}.png`;
      $("source-text").textContent = `From sudoku photo ${found.photo}, row ${found.row + 1}, ` +
        `column ${found.col + 1} (${found.source}, ${found.licence}).`;
      $("source").hidden = false;
    } catch (error) {
      $("source").hidden = true;
    }
  }, 80);
}

function showDetail(cell) {
  hovered = cell;
  showSource(cell);
  $("preview").src = `/cell/${cell.stem}.png`;
  $("detail").textContent = detailText(cell);
  $("related").innerHTML = nearDuplicates(cell)
    .map((id) => `<img class="small" alt="" src="/cell/${id.slice(0, 16)}.png">`).join("");
}

function title() {
  let text = "";
  if (mode === "groups") {
    text = !screen ? "Every grouped cell has a kind." :
      `Digit ${screen.folder} · ${screen.predicted ? `model guess: ${screen.predicted === "other" ? "none or notes" : screen.predicted}` : screen.ungrouped ? "cells added after grouping" : `group ${screen.group + 1} of ${screen.groups}`}` +
      `${screen.pages > 1 ? ` · screen ${screen.page + 1} of ${screen.pages}` : ""}` +
      ` · folder ${screen.folder}/: ${screen.progress.labelled} of ${screen.progress.cells} labelled`;
  } else if (mode === "review") {
    text = !screen ? "" : screen.open ? `${screen.open} cells to review` : "Nothing to review.";
  } else if (mode === "check") {
    text = screen ? `Check · screen ${checkPage + 1} of ${Math.ceil(screen.cells.length / PAGE)}` : "";
  } else if (mode === "digits") {
    text = !screen ? "" : `Digit ${screen.digit} · ${screen.left} cells left · ` +
      `${screen.kinds === "all" ? "all kinds" : "handwritten only"}` +
      `${screen.not_prelabelled ? ` · ${screen.not_prelabelled} cells without a pre-label` : ""}`;
  } else if (mode === "photos") {
    return;
  } else if (mode === "finish") {
    text = "Finish";
  } else {
    text = "Progress";
  }
  $("title").textContent = text;
}

const goTo = (label, target) => [label, () => open(target)];

async function prelabel() {
  showState("loading", "Pre-labelling…", [], "The first run takes a while.");
  renderActions();
  const count = (await api("/api/prelabel", {})).result;
  await reload();
  say(`Pre-labelled ${count} new cells.`);
}

const STOP_SUSPECTS = "Stop the server with Ctrl-C. Run just suspects. Start the server again. Then open Review.";

// What to do next on this screen. An empty screen says what comes next, with a button for it.
function bannerFor() {
  if (view.kind === "loading" || view.kind === "error") return ["", []];
  if (mode === "photos") {
    if (photo) {
      return [corners ? `${DO.photos} Digits sideways? Press T. You cannot undo a photo.`
        : "No grid found. Click the 4 corners, then press Enter. Press T after the 4 corners to turn the grid.", []];
    }
    if (!lastStatus) return ["", []];
    if (lastStatus.photos_total === 0) {
      return ["No photos yet. Run just import-photos <folder>.", []];
    }
    return ["All photos are checked. Next: Confirm digits.", [goTo("Open Confirm digits", "digits")]];
  }
  if (mode === "digits") {
    if (!screen) return ["", []];
    const n = screen.not_prelabelled;
    const missing = n ? [[`${n} new ${n === 1 ? "cell has" : "cells have"} no pre-label.`],
      [["Pre-label new cells", () => run(prelabel)]]] : [[], []];
    const join = (text, buttons) => [[text, ...missing[0]].join(" "), [...buttons, ...missing[1]]];
    const shown = DIGITS.reduce((sum, d) => sum + screen.counts[d], 0);
    if (screen.left) {
      const text = screen.digit === "empty" ? "Click each cell that shows a digit. Then press Enter."
        : `Click each cell that is not ${screen.digit === "8" ? "an" : "a"} ${screen.digit}. Then press Enter.`;
      return join(text, []);
    }
    const next = DIGITS.find((d) => screen.counts[d] > 0);
    if (next) {
      return join(`No cells left for ${screen.digit}. Open digit ${next}.`,
        [[`Open digit ${next}`, () => run(() => loadDigits(next))]]);
    }
    if (!lastStatus) return ["", []];
    if (lastStatus.digits > shown) return join("Press K to show all kinds.", []);
    if (n) return [missing[0].join(" "), missing[1]];
    return ["All digits are confirmed. Next: Label kind.", [goTo("Open Label kind", "groups")]];
  }
  if (mode === "groups") {
    const n = lastStatus ? lastStatus.kind_not_prelabelled : 0;
    const missing = n ? [`${n} ${n === 1 ? "cell has" : "cells have"} no model guess yet.`,
      [["Pre-label new cells", () => run(prelabel)]]] : ["", []];
    const join = (text) => [[text, missing[0]].filter(Boolean).join(" "), missing[1]];
    if (screen) {
      const guess = { printed: DO.guessPrinted, handwritten: DO.guessHandwritten, other: DO.guessOther };
      return join(guess[screen.predicted] || DO.groups);
    }
    return ["", []];
  }
  if (mode === "review") {
    return [screen && screen.open ? DO.review : "", []];
  }
  if (mode === "check") {
    return screen ? [DO.check, []] : ["", []];
  }
  if (mode === "finish" || !progressData) return ["", []];
  const left = cellsWithoutKind(progressData);
  return [left ? `${left} cells still need a kind. Press a button in the To do column.` : "", []];
}

function renderBanner() {
  // The state carries its own message and button. The banner only gives the instruction.
  const [text, buttons] = view.kind === "ready" ? bannerFor() : ["", []];
  const banner = $("banner");
  banner.textContent = text;
  for (const [label, action] of buttons) {
    const button = document.createElement("button");
    button.textContent = label;
    button.onclick = action;
    banner.append(button);
  }
}

function renderFolders() {
  if (mode === "groups") {
    $("folders").innerHTML = "Jump to folder: " + [1, 2, 3, 4, 5, 6, 7, 8, 9].map((f) =>
      `<button data-folder="${f}" class="${screen && screen.folder === String(f) ? "on" : ""}">${f}</button>`).join(" ");
    for (const b of $("folders").querySelectorAll("button")) {
      b.onclick = () => open("groups", { folder: b.dataset.folder, group: 0 });
    }
  } else if (mode === "digits" && screen) {
    $("folders").innerHTML = "Digit: " + DIGITS.map((d) =>
      `<button data-digit="${d}" class="${screen.digit === d ? "on" : ""}">${d} (${screen.counts[d]})</button>`).join(" ");
    for (const b of $("folders").querySelectorAll("button")) {
      b.onclick = () => run(() => loadDigits(b.dataset.digit));
    }
  } else {
    $("folders").innerHTML = "";
  }
}

const ACTIONS = {
  groups: [["P · all printed", () => setAll("printed")], ["H · all handwritten", () => setAll("handwritten")],
           ["Enter · save", () => save()], ["S · skip", () => skip()], ["Z · undo", () => undo()]],
  review: [["Enter · confirm this screen", () => save()], ["Z · undo", () => undo()]],
  check: [["P · all printed", () => setAll("printed")], ["H · all handwritten", () => setAll("handwritten")],
          ["Enter · save", () => save()]],
  photos: [["Enter · Accept grid", () => acceptPhoto(), "Cut the cells from this grid outline."],
           ["R · Reject: not a sudoku", () => rejectPhoto(), "Never use this photo."],
           ["S · Skip: decide later", () => skipPhoto(), "Look at it again after the other photos."],
           ["C · Reset corners", () => clearCorners(), "Go back to the outline that the import found."],
           ["T · Turn grid 90°", () => turnGrid(),
            "Use this when the digits in the right image lie sideways or upside down."]],
  digits: [["Enter · confirm screen", () => save()], ["K · handwritten or all kinds", () => toggleKinds()],
           ["Z · undo", () => undo()]],
  progress: [],
  finish: [],
};

function renderActions() {
  const footer = $("actions");
  footer.innerHTML = "";
  for (const [label, action, hint] of ACTIONS[mode]) {
    const button = document.createElement("button");
    button.textContent = label;
    if (hint) button.title = hint;
    button.onclick = () => run(action);
    const key = label[0].toLowerCase();
    button.disabled = isBlocked() && !allowedWhenBlocked(key);
    footer.append(button);
  }
}

// The corner query that refreshPreview last showed. Enter cuts only the corners that it shows.
let previewQuery = null;

function cornerQuery() {
  return corners.flat().map((v) => v.toFixed(1)).join(",");
}

function drawQuad() {
  const img = $("photo");
  if (!img || !photo) return;
  const scale = img.clientWidth / photo.width;
  const points = clicks.length ? clicks : corners || [];
  const xy = points.map(([x, y]) => [x * scale + PAD, y * scale + PAD]);
  const colour = clicks.length ? "#f2b705" : "#3ad65a";
  const polygon = xy.length === 4
    ? `<polygon points="${xy.map((p) => p.join(",")).join(" ")}" fill="none" stroke="${colour}" stroke-width="2"/>` : "";
  $("quad").innerHTML = polygon + xy.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="5" fill="${colour}"/>`).join("");
}

async function refreshPreview() {
  const stem = photo.stem;
  const query = cornerQuery();
  $("flat").src = `/flat/${stem}.png?c=${query}`;
  const value = await api(`/api/photos/usable?photo=${stem}&c=${query}`);
  // The person can accept, skip or leave the photo while the request runs.
  if (!photo || photo.stem !== stem || !$("usable")) return;
  $("usable").textContent = `${value.usable} of 81 cells are inside the photo.`;
  previewQuery = query;
  drawQuad();
}

function clickCorner(event) {
  const rect = $("photo").getBoundingClientRect();
  const scale = rect.width / photo.width;
  clicks.push([(event.clientX - rect.left) / scale, (event.clientY - rect.top) / scale]);
  if (clicks.length === 4) {
    corners = clicks;
    clicks = [];
    renderBanner();
    const stem = photo.stem;
    refreshPreview().catch((error) => {
      // A late answer must not paint over a screen that the person already left.
      if (mode === "photos" && photo && photo.stem === stem) say(error.message);
    });
  }
  drawQuad();
}

async function renderPhoto() {
  $("grid").innerHTML = "";
  if (!photo) {
    $("photos").innerHTML = "";
    $("title").textContent = "No photo to check.";
    return;
  }
  $("title").textContent = `Photo ${photo.stem} · ${photo.pending} to check · ${photo.reason}`;
  $("photos").innerHTML = `<div class="photo-row">
    <div class="wrap" id="wrap"><img id="photo" alt="" src="/photo/${photo.stem}.jpg"><svg id="quad"></svg></div>
    <div><img class="flat" id="flat" alt=""><p id="usable"></p></div></div>`;
  $("photo").onload = drawQuad;
  $("wrap").onclick = clickCorner;
  if (corners) {
    // Not wrapped in run: the callers already hold the busy guard, and run would drop the call.
    await refreshPreview();
  } else {
    $("usable").textContent = "No grid found. Click the 4 corners: top left, top right, bottom right, bottom left.";
  }
}

const loadPhoto = (after) => asLoad(() => run(() => loadPhoto(after)), () => loadPhotoNow(after));

async function loadPhotoNow(after) {
  photo = await api(`/api/photos/next${after ? `?after=${after}` : ""}`);
  if (!photo) lastStatus = await api("/api/status");
  endLoading();
  corners = photo && photo.corners;
  clicks = [];
  previewQuery = null;
  render();  // the nav, the help and the buttons of the Photos screen
  await renderPhoto();
}

async function acceptPhoto() {
  if (!photo) return;
  if (!corners) return say("Click the 4 corners first.");
  if (cornerQuery() !== previewQuery) {
    return say("The preview is not up to date. Wait a moment and press Enter again.");
  }
  const result = (await api("/api/photos/accept", { photo: photo.stem, corners })).result;
  const text = result.decision === "accepted"
    ? `Saved ${result.cells} cells. ${result.duplicates} were already known.`
    : "Too few cells are inside the photo. The photo is skipped for good.";
  await loadPhoto(photo.stem);
  say(text);
}

async function rejectPhoto() {
  if (!photo) return;
  await api("/api/photos/reject", { photo: photo.stem });
  await loadPhoto(photo.stem);
  say("Rejected.");
}

async function skipPhoto() {
  if (!photo) return;
  await loadPhoto(photo.stem);
  say("Skipped. The photo comes back after the others.");
}

// A cyclic shift keeps the quad convex. The cells turn 90° clockwise. Four turns return to the start.
async function turnGrid() {
  if (!photo) return;
  if (clicks.length) return say("Finish the 4 corners first. Then press T.");
  if (!corners) return say("Click the 4 corners first. Then press T to turn the grid.");
  corners = [corners[3], corners[0], corners[1], corners[2]];
  clicks = [];
  previewQuery = null;
  drawQuad();
  renderBanner();
  await refreshPreview();
}

function clearCorners() {
  if (!photo) return;
  clicks = [];
  corners = photo.corners;
  previewQuery = null;
  renderBanner();
  const stem = photo.stem;
  renderPhoto().catch((error) => {
    if (mode === "photos" && photo && photo.stem === stem) say(error.message);
  });
}

const loadDigits = (next) => asLoad(() => run(() => loadDigits(next)), () => loadDigitsNow(next));

async function loadDigitsNow(next) {
  if (next) digit = next;
  const value = await api(`/api/digits?digit=${digit}&kinds=${kinds}`);
  if (!value.left) lastStatus = await api("/api/status");
  setScreen(value);
}

async function toggleKinds() {
  kinds = kinds === "handwritten" ? "all" : "handwritten";
  await loadDigits();
  say(kinds === "all" ? "All kinds are shown." : "Only handwritten cells are shown.");
}

function render() {
  for (const b of document.querySelectorAll("nav button")) b.classList.toggle("on", b.dataset.mode === mode);
  document.body.className = `mode-${mode}`;
  $("help").innerHTML = HELP[mode];
  deriveView();
  renderBanner();
  renderFolders();
  renderActions();
  $("table").innerHTML = "";
  if (mode !== "photos") $("photos").innerHTML = "";
  const grid = $("grid");
  grid.innerHTML = "";
  for (const cell of cellsOnScreen()) {
    const kind = local[cell.id];
    const div = document.createElement("div");
    let tagText = LETTER[kind] || "·";
    let classes = `cell ${kind || ""} ${cell.least_sure ? "least" : ""}`;
    if (mode === "digits") {
      const mark = local[cell.id];
      tagText = mark === "skip" ? "–" : mark === "discarded" ? "✕" : (mark || screen.digit);
      classes = `cell ${mark === "skip" ? "skip" : ""} ${mark === "discarded" ? "discarded" : ""} ` +
        `${mark && mark !== "skip" && mark !== "discarded" ? "changed" : ""}`;
    }
    div.className = classes;
    div.innerHTML = `<img src="/cell/${cell.stem}.png" alt=""><span class="tag">${tagText}</span>`;
    if (mode === "review") {
      const reason = document.createElement("span");
      reason.className = "reason";
      reason.textContent = reasonText(cell);
      div.append(reason);
    }
    div.onclick = (event) => {
      if (mode === "digits") {
        local[cell.id] = local[cell.id] === "skip" ? undefined : "skip";
        return render();
      }
      if (cell.folder === "empty") return say("An empty cell has no kind. Press a digit if it shows one.");
      local[cell.id] = event.altKey ? "unsure" : (local[cell.id] === "printed" ? "handwritten" : "printed");
      render();
    };
    div.onmouseenter = () => showDetail(cell);
    div.onmouseleave = () => { hovered = null; };
    grid.append(div);
  }
  title();
}

function setScreen(value) {
  endLoading();
  screen = value;
  local = {};
  hovered = null;
  if (mode === "groups" && screen) for (const c of screen.cells) local[c.id] = c.start;
  if (mode === "review" && screen) for (const c of screen.items) local[c.id] = c.kind;
  render();
  if (mode === "groups" && screen && screen.cells.every((c) => !c.start)) {
    say("Press P or H to start this screen.");
  } else if (mode === "groups" && screen && screen.predicted) {
    say("The cells start with the model's guess. Fix the exceptions, then press Enter.");
  } else if (mode === "groups") {
    say("The cells start with the kind most cells in this group have. Fix the exceptions, then press Enter.");
  }
}

const loadGroups = (after) => asLoad(() => run(() => loadGroups(after)), () => loadGroupsNow(after));

async function loadGroupsNow(after) {
  const query = after ? `?folder=${after.folder}&group=${after.group}&page=${after.page}` : "";
  const value = await api(`/api/next${query}`);
  if (!value) lastStatus = await api("/api/status");
  setScreen(value);
}

async function reload() {
  if (mode === "groups" && screen) {
    setScreen(await api(`/api/screen?folder=${screen.folder}&group=${screen.group}&page=${screen.page}`));
  } else if (mode === "groups") {
    await loadGroups();
  } else if (mode === "digits") {
    await loadDigits();
  } else if (mode === "review") {
    setScreen(await api("/api/review"));
  }
}

function setAll(kind) {
  for (const c of cellsOnScreen()) if (c.folder !== "empty") local[c.id] = kind;
  render();
  say("Now click the cells of the other kind, then press Enter.");
}

async function move(cell, digit) {
  await api("/api/move", { id: cell.id, digit, screen: mode === "review" ? "review" : "groups" });
  const unsaved = local;
  await reload();
  for (const id in unsaved) if (id in local) local[id] = unsaved[id];
  render();
  say(`Moved to ${digit === "empty" ? "empty" : `folder ${digit}`}. Press Z to undo.`);
}

async function skip() {
  if (mode === "groups" && screen) {
    await loadGroups(screen);
    say("Skipped. The skipped screen comes back after all others.");
  }
}

async function undo() {
  const result = await api("/api/undo", {});
  await reload();
  say(result.result ? `Undone: ${result.result} changes.` : "Nothing to undo in this session.");
}

async function save() {
  const cells = cellsOnScreen();
  if (mode === "groups" && screen) {
    const missing = cells.filter((c) => !local[c.id]).length;
    if (missing) return say(`${missing} cells have no kind yet (·). Press P or H, or click them.`);
    const result = await api("/api/save", { screen: "groups", cells: cells.map((c) => ({ id: c.id, kind: local[c.id] })) });
    const before = `Saved: ${result.result} changes.`;
    await loadGroups(screen);
    say(`${before} ${$("message").textContent}`);
  } else if (mode === "digits" && screen) {
    const entries = cells.filter((c) => local[c.id] !== "skip")
      .map((c) => ({ id: c.id, digit: local[c.id] || screen.digit }));
    const result = await api("/api/assign", { screen: "digits", cells: entries });
    await loadDigits();
    say(`Saved: ${result.result} cells. ${$("message").textContent}`);
  } else if (mode === "review" && screen) {
    const kindCells = cells.filter((c) => c.folder !== "empty" &&
      (c.field === "kind" || (local[c.id] && local[c.id] !== c.kind)));
    const result = await api("/api/save", {
      screen: "review",
      cells: kindCells.map((c) => ({ id: c.id, kind: local[c.id] })),
      confirm_digits: cells.filter((c) => c.field === "digit").map((c) => c.id),
    });
    setScreen(await api("/api/review"));
    say(`Confirmed: ${result.result} labels.`);
  } else if (mode === "check" && screen) {
    const missing = cells.filter((c) => !local[c.id]).length;
    if (missing) return say(`${missing} cells have no answer yet (·).`);
    const result = (await api("/api/check", { answers: cells.map((c) => ({ id: c.id, answer: local[c.id] })) })).result;
    checkPage += 1;
    local = {};
    if (checkPage * PAGE < screen.cells.length) { render(); return say("Saved. Label the next screen."); }
    screen = null;
    checkDone = true;
    render();
    $("title").textContent = `Check done: ${(result.agreement * 100).toFixed(1)} % agreement on ${result.n} cells.`;
    say("The disagreements are now on the Review screen.");
    renderConfusion(result.confusion);
  }
}

function renderConfusion(confusion) {
  const answers = ["printed", "handwritten", "unsure"];
  const rows = Object.entries(confusion).map(([label, row]) =>
    `<tr><th>${label}</th>${answers.map((a) => `<td>${row[a] || 0}</td>`).join("")}</tr>`);
  $("table").innerHTML = `<table><tr><th>Label \\ answer</th>${answers.map((a) => `<th>${a}</th>`).join("")}</tr>${rows.join("")}</table>`;
}

const cellsWithoutKind = (value) =>
  Object.values(value.folders).reduce((sum, f) => sum + f.without, 0);

// The first group of the folder with a missing kind. A finished folder opens at group 1.
const firstGroup = (f) => Math.max(0, f.groups.findIndex((g) => g.without > 0));

function addButton(parent, label, action) {
  const button = document.createElement("button");
  button.textContent = label;
  button.onclick = action;
  parent.append(button);
}

function checkLine(check) {
  if (!check) return "Check: not done yet. Do it after 7 days.";
  return `Check: you agreed with ${(check.agreement * 100).toFixed(1)} % of ${check.n} labels ` +
    `(${check.date}).`;
}

const PROGRESS_COLUMNS = [
  ["Digit", "The digit of these cells."],
  ["Cells", "All cells in this folder."],
  ["Printed", "Cells that you labelled printed."],
  ["Handwritten", "Cells that you labelled handwritten."],
  ["Unsure", "You could not decide. Training ignores these cells."],
  ["Without a kind", "Cells that still need a printed or handwritten label."],
  ["Digit corrected", "Cells that you moved to another digit after the first pass."],
  ["To do", "What to do next in this folder."],
];

function renderProgress(value) {
  endLoading();
  progressData = value;
  render();
  renderBanner();
  const left = cellsWithoutKind(value);
  const table = $("table");
  table.innerHTML = "";
  const summary = document.createElement("p");
  summary.className = "summary";
  summary.textContent = left ? `${left} cells still need a kind.` : "Every cell has a kind. ✓ Next: Review.";
  table.append(summary);
  const buttons = document.createElement("div");
  buttons.className = "buttons";
  if (left) {
    for (const [folder, f] of Object.entries(value.folders)) {
      if (f.without) {
        addButton(buttons, `Digit ${folder}: ${f.without} cells`,
          () => open("groups", { folder, group: firstGroup(f) }));
      }
    }
  } else {
    addButton(buttons, "Open Review", () => open("review"));
    const line = document.createElement("p");
    line.className = "summary-line";
    line.textContent = STOP_SUSPECTS;
    table.append(line);
  }
  table.append(buttons);
  const grid = document.createElement("table");
  grid.innerHTML = "<thead><tr>" + PROGRESS_COLUMNS.map(([name, tip]) =>
    `<th title="${tip}">${name}</th>`).join("") + "</tr></thead><tbody></tbody><tfoot></tfoot>";
  const sum = (key) => Object.values(value.folders).reduce((n, f) => n + f[key], 0);
  for (const [folder, f] of Object.entries(value.folders)) {
    const row = grid.tBodies[0].insertRow();
    row.innerHTML = `<th>${folder}</th><td>${f.cells}</td><td>${f.printed}</td><td>${f.handwritten}</td>` +
      `<td>${f.unsure}</td><td>${f.without}</td><td>${f.moved_out}</td><td class="todo"></td>`;
    const todo = row.lastElementChild;
    if (f.without) {
      addButton(todo, `Label ${f.without} cells`, () => open("groups", { folder, group: firstGroup(f) }));
    } else {
      todo.innerHTML = '<span class="done">Done</span> ';
    }
    const look = document.createElement("a");
    look.href = "#";
    look.textContent = "Look again";
    look.onclick = (event) => {
      event.preventDefault();
      open("groups", { folder, group: 0 });
    };
    todo.append(" ", look);
  }
  grid.tFoot.insertRow().innerHTML = "<th>Total</th>" +
    ["cells", "printed", "handwritten", "unsure", "without", "moved_out"]
      .map((key) => `<td>${sum(key)}</td>`).join("") + "<td></td>";
  table.append(grid);
  const notes = document.createElement("p");
  notes.className = "notes";
  notes.innerHTML = "";
  const lines = [`Review: ${value.review_open} cells to look at.`, checkLine(value.check)];
  if (value.link_line) lines.push(value.link_line);
  for (const text of lines) {
    const line = document.createElement("div");
    line.textContent = text;
    notes.append(line);
  }
  table.append(notes);
  $("title").textContent = "Progress";
}

async function refreshStatus() {
  try {
    const value = await api("/api/status");
    lastStatus = value;
    const counts = {
      photos: value.photos, digits: value.digits + value.not_prelabelled, kind: value.kind,
    };
    for (const badge of document.querySelectorAll("[data-count]")) {
      const n = counts[badge.dataset.count];
      badge.textContent = n === 0 ? "✓" : n;
      badge.classList.toggle("done", n === 0);
    }
    renderBanner();
  } catch (error) {
    // The counts are a convenience. A failed refresh must not hide the real message.
  }
}

const FINISH_NEXT = "Commit the lists: git add ml/datasets and commit.";

function finishPanel(result) {
  const report = result.report;
  const counts = (items) => Object.entries(items).map(([name, n]) => `${name} ${n}`).join(", ");
  const removed = result.removed.length ? result.removed.join(", ") : "nothing";
  const link = report.link_line;
  return showState("done", "Finished. Nothing is lost if you stop now.", [], [
    `Cells: ${counts(report.cells)}.`,
    `Photos: ${counts(report.photos)}.`,
    link,
    `Still waiting: ${result.still_waiting.cells} cells, ${result.still_waiting.photos} photos.`,
    `Removed: ${removed}.`,
    FINISH_NEXT,
  ].join("\n"));
}

function showWorking() {
  if (!busy || view.kind === "loading") return;
  for (const b of $("actions").querySelectorAll("button")) b.disabled = true;
  const note = document.createElement("span");
  note.textContent = "Saving…";
  $("actions").append(note);
}

async function run(action) {
  // A held or double Enter would otherwise send the same screen twice.
  if (busy) return;
  busy = true;
  const timer = setTimeout(showWorking, 300);
  try {
    await action();
  } catch (error) {
    if (error.load) fail(error);
    else failAction(error);
  } finally {
    clearTimeout(timer);
    busy = false;
    if (view.kind === "ready" || view.kind === "done" || view.kind === "empty") renderActions();
    refreshStatus();
  }
}

async function open(next, target) {
  if (busy) return say("Wait for the current action to finish.");
  mode = next;
  lastTarget = target;
  checkDone = false;
  checkError = "";
  finishResult = null;
  progressData = null;
  screen = null;
  local = {};
  hovered = null;
  say("");
  startLoading();
  render();
  const load = async () => {
    if (mode === "photos") {
      await loadPhoto();
    } else if (mode === "digits") {
      await loadDigits();
    } else if (mode === "groups" && target) {
      setScreen(await api(`/api/screen?folder=${target.folder}&group=${target.group}&page=0`));
    } else if (mode === "groups") {
      await loadGroups();
    } else if (mode === "finish") {
      finishResult = (await api("/api/finish", {})).result;
      endLoading();
      render();
    } else if (mode === "review") {
      setScreen(await api("/api/review"));
    } else if (mode === "check") {
      const value = await api("/api/check");
      checkPage = 0;
      if (value.error) {
        checkError = value.error;
        endLoading();
        render();
      } else {
        setScreen(value);
      }
    } else {
      renderProgress(await api("/api/progress"));
    }
  };
  await run(() => asLoad(() => open(next, target), load));
}

document.addEventListener("keydown", (event) => {
  if (event.metaKey || event.ctrlKey || event.target.tagName === "BUTTON" && event.key === "Enter") return;
  const key = event.key.toLowerCase();
  if (isBlocked() && !allowedWhenBlocked(key)) return;
  if (mode === "photos") {
    if (key === "enter") run(acceptPhoto);
    else if (key === "r") run(rejectPhoto);
    else if (key === "s") run(skipPhoto);
    else if (key === "c") clearCorners();
    else if (key === "t") run(turnGrid);
    return;
  }
  if (mode === "digits" && (/^[0-9]$/.test(key) || key === "x")) {
    if (!hovered) return say("Point at a cell first, then press the key.");
    local[hovered.id] = key === "x" ? "discarded" : key === "0" ? "empty" : key;
    return render();
  }
  if (mode === "digits" && key === "k") return run(toggleKinds);
  if (key === "z" && mode === "digits") return run(undo);
  if ((key === "p" || key === "h") && (mode === "groups" || mode === "check")) {
    setAll(key === "p" ? "printed" : "handwritten");
  } else if (/^[0-9]$/.test(key) && (mode === "groups" || mode === "review")) {
    if (!hovered) return say("Point at a cell first, then press the digit.");
    run(() => move(hovered, key === "0" ? "empty" : key));
  } else if (key === "enter") {
    run(save);
  } else if (key === "s" && mode === "groups") {
    run(skip);
  } else if (key === "z" && (mode === "groups" || mode === "review")) {
    run(undo);
  }
});

for (const b of document.querySelectorAll("nav button[data-mode]")) b.onclick = () => open(b.dataset.mode);
// The Groups and Review screens start with marks. Only a change from the start is unsaved.
function hasUnsavedMarks() {
  const cells = screen ? cellsOnScreen() : [];
  if (mode === "groups") return cells.some((c) => (local[c.id] ?? null) !== (c.start ?? null));
  if (mode === "review") return cells.some((c) => (local[c.id] ?? null) !== (c.kind ?? null));
  return Object.keys(local).length > 0;
}

$("finish").onclick = () => {
  // open() clears the marks that are not saved.
  const unsaved = "You have marks that are not saved. Finish now and lose them?";
  if (hasUnsavedMarks() && !confirm(unsaved)) return;
  open("finish");
};
open("groups");
</script>
