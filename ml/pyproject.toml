[project]
name = "sudoku-ml"
version = "0.1.0"
description = "Training, evaluation and export for the sudoku cell classifier"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ai-edge-litert==2.2.0",
    "litert-torch==0.9.4",
    "numpy>=2.2",
    "pillow==12.3.0",
    "torch==2.13.0",
]

# litert-torch 0.9.4 requires torch below 2.14 (ADR-005).
# On Linux (CI), torch comes from the CPU index, so CI never downloads CUDA wheels.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["uv_build>=0.11.31,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "opencv-python-headless==5.0.0.93",
    "flatbuffers",
    "pytest>=8.4",
    "ruff>=0.12",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ERA", "FIX", "PGH004"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Upstream: torch.utils._pytree, called from litert_torch. Remove when litert_torch drops LeafSpec.
    "ignore:`isinstance\\(treespec, LeafSpec\\)` is deprecated:FutureWarning",
]
