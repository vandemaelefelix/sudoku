name: ios-simulator-build
description: Build the development variant in Release for the iOS Simulator with the stub model. Run actions/checkout first.
runs:
  using: composite
  steps:
    # Expo SDK 57 needs Xcode 26.4 or later. A pinned version keeps a new image default from changing the build.
    - run: echo "DEVELOPER_DIR=/Applications/Xcode_26.6.app/Contents/Developer" >> "$GITHUB_ENV"
      shell: bash
    # A wrong Xcode path fails here in seconds, not after the install.
    - run: test -d "$DEVELOPER_DIR"
      shell: bash
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    # No cache: each one cost more time to restore than it saved (ADR-010, amendment 2026-10-22).
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
    - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
    # Only the app and its workspace packages. setup-ts also runs sst install, which the build does not need.
    - run: pnpm install --frozen-lockfile --filter mobile...
      shell: bash
    # SUD-08: the model is not in git and never enters CI. Metro needs a file to bundle; its content does not matter here.
    - run: touch mobile/assets/models/cell-classifier.tflite
      shell: bash
    - run: just ios-simulator
      shell: bash
