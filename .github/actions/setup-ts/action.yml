name: setup-ts
description: Install pnpm, Node, just, the dependencies and the SST providers.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
    - run: pnpm install --frozen-lockfile
      shell: bash
    # boundaries and typecheck:infra read the types that sst install writes to .sst/. It needs no AWS credentials.
    # app() skips layer 2 of the account guard in CI (ADR-027).
    - run: pnpm exec sst install --stage felix
      shell: bash
