name: ci-ts
on:
  push:
    branches: [main]
    paths: &paths
      - apps/**
      - packages/**
      - services/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .npmrc
      - .nvmrc
      - tsconfig.base.json
      - tsconfig.infra.json
      - sst.config.ts
      - infra/**
      - .oxlintrc.json
      - .dependency-cruiser.cjs
      - justfile
      - .github/workflows/ci-ts.yml
  pull_request:
    paths: *paths

jobs:
  ts:
    runs-on: ubuntu-latest
    # The sync-api DB tests need DynamoDB Local. Keep the tag equal to dynamodb_image in the justfile.
    services:
      dynamodb:
        image: amazon/dynamodb-local:3.3.1
        ports:
          - 8000:8000
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: extractions/setup-just@v4
      - run: pnpm install --frozen-lockfile
      # boundaries reads the types that sst install writes to .sst/. It needs no AWS credentials. app() skips layer 2 of the account guard in CI (ADR-027).
      - run: pnpm exec sst install --stage felix
      - run: just typecheck
      - run: just lint-ts
      - run: just boundaries
      - run: just test-ts
      - run: pnpm --filter @sudoku/sync-api test:db
        env:
          DYNAMODB_ENDPOINT: http://localhost:8000
      - run: pnpm typecheck:infra
      # The model is not in git (ADR-007, amendment). Metro needs a file to bundle; its content does not matter here.
      - run: touch apps/mobile/assets/models/cell-classifier.tflite
      - run: just bundle
