name: ci-ts
on:
  push:
    branches: [main]
    paths: &paths
      - apps/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .npmrc
      - .nvmrc
      - tsconfig.base.json
      - tsconfig.infra.json
      - sst.config.ts
      - infra/**
      - .oxlintrc.json
      - .dependency-cruiser.cjs
      - justfile
      - .github/workflows/ci-ts.yml
  pull_request:
    paths: *paths

jobs:
  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: extractions/setup-just@v4
      - run: pnpm install --frozen-lockfile
      - run: just typecheck
      - run: just lint-ts
      - run: just boundaries
      - run: just test-ts
      # The model is not in git (ADR-007, amendment). Metro needs a file to bundle; its content does not matter here.
      - run: touch apps/mobile/assets/models/cell-classifier.tflite
      - run: just bundle
