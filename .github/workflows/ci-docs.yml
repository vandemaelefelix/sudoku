name: ci-docs
on:
  push:
    branches: [main]
    paths: &paths
      - "**/*.md"
      - scripts/check_links.py
      - justfile
      - .github/workflows/ci-docs.yml
  pull_request:
    paths: *paths

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - run: just docs-check
