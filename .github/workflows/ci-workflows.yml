name: ci-workflows
on:
  push:
    branches: [main, develop]
    paths: &paths
      - .github/**
  pull_request:
    paths: *paths

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The SHA-256 is the official checksum of the release tarball (actionlint_1.7.12_checksums.txt).
      - name: Install actionlint
        run: |
          curl -fsSL -o actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum --check
          tar -xzf actionlint.tar.gz actionlint
      - run: ./actionlint -color
