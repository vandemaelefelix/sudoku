name: ios-simulator
# A macOS minute counts ten times on the Free plan of a private repository (ADR-010, amendment 2026-10-22).
# So the build runs only when a native input of the app changes, and on a manual run.
# pnpm-lock.yaml, pnpm-workspace.yaml and the justfile are not paths: each changes in many pull requests that touch no native code.
on:
  pull_request:
    paths:
      - mobile/package.json
      - mobile/app.json
      - mobile/app.config.ts
      - mobile/ios/**
      - .github/workflows/ios-simulator.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-simulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      # Expo SDK 57 needs Xcode 26.4 or later. A pinned version keeps a new image default from changing the build.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      APP_VARIANT: development
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      # Only the app and its workspace packages. setup-ts also runs sst install, which the build does not need.
      - run: pnpm install --frozen-lockfile --filter mobile...
      # SUD-08: the model is not in git and never enters CI. Metro needs a file to bundle; its content does not matter here.
      - run: touch mobile/assets/models/cell-classifier.tflite
      - run: pnpm exec expo prebuild --platform ios --no-install
        working-directory: mobile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            mobile/ios/Pods
            mobile/ios/Podfile.lock
          key: pods-${{ hashFiles('mobile/ios/Podfile', 'mobile/ios/Podfile.properties.json', 'pnpm-lock.yaml') }}
          restore-keys: pods-
      - run: pod install
        working-directory: mobile/ios
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: mobile/ios/DerivedData
          key: derived-data-${{ hashFiles('mobile/ios/Podfile.lock', 'pnpm-lock.yaml') }}
          restore-keys: derived-data-
      - run: just ios-simulator-build
      # ditto keeps the permissions and symlinks of the bundle. The zip goes up as it is, without a second archive.
      - run: ditto -c -k --keepParent SudokuDev.app "$GITHUB_WORKSPACE/SudokuDev-simulator.zip"
        working-directory: mobile/ios/DerivedData/Build/Products/Release-iphonesimulator
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: SudokuDev-simulator.zip
          archive: false
          if-no-files-found: error
          # The Free plan has 500 MB of artifact storage for a private repository.
          retention-days: 7
