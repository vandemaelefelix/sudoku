# QR-11: a game survives a kill of the app. The move and the time come back.
appId: com.vandemaelefelix.sudoku.dev
---
- launchApp:
    clearState: true
- tapOn:
    id: new-game-easy
# The move comes after 3 s, so a timer that starts again at 00:00 fails the last check.
- extendedWaitUntil:
    visible:
      id: timer
      text: '.*time 00:0[3-9]'
    timeout: 10000
- runFlow: common/place-digit.yaml
- killApp
- launchApp
- tapOn:
    id: continue
- assertVisible:
    id: "cell-\\d+"
    text: '${output.place}, (wrong )?5'
- assertVisible:
    id: timer
- assertNotVisible:
    id: timer
    text: '.*time 00:0[0-2]'
